name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Locked Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Run Automated Tests
        run: npm test

      - name: Build Core and Playground
        run: npm run build

      - name: Validate VS Code extension and runner scripts
        run: |
          node --check vscode-extension/extension.js
          node --check scripts/container-runner.mjs

      - name: Build Isolated Container Runner
        run: docker build -f Dockerfile.sandbox -t wibuscript-runner:ci .

      - name: Smoke Test Container Sandbox
        run: WIBUSCRIPT_DOCKER_TESTS=1 npm test -- tests/container_sandbox.test.ts
