# File: .github/workflows/pr-validation.yml
name: Enterprise PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  enterprise-validation:
    name: Enterprise Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Type Checking and Compilation
        run: npm run build

      - name: Absolute Unit Test Validation
        run: npm run test
