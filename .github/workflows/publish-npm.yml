name: Publish WibuScript to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    name: Test, Build, and Publish to npmjs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm Trusted Publishing support
        run: |
          export NPM_VERSION="$(npm --version)"
          echo "Using npm $NPM_VERSION"
          node -e '
            const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
              console.error("npm Trusted Publishing requires npm >= 11.5.1");
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run core:build

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish to npmjs using OIDC Trusted Publishing
        run: npm publish --access public --provenance
