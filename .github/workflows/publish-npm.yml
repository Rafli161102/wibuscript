name: Publish WibuScript to npmjs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-npm.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    name: Test, Build, and Publish to npmjs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Prepare npm config for OIDC
        shell: bash
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          mkdir -p "$(dirname "$npmrc")"
          touch "$npmrc"
          # setup-node writes a classic token placeholder; remove it so npm
          # can use the GitHub Actions OIDC exchange for trusted publishing.
          sed -i '/_authToken/d' "$npmrc"
          if ! grep -q '^registry=' "$npmrc"; then
            echo 'registry=https://registry.npmjs.org/' >> "$npmrc"
          fi
          echo "npm config prepared for OIDC (no static auth token entry)."

      - name: Verify GitHub OIDC availability
        shell: bash
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "::error::GitHub OIDC URL is missing. Check job permission id-token: write."
            exit 1
          }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "::error::GitHub OIDC request token is missing."
            exit 1
          }
          echo "GitHub Actions OIDC environment is available."

      - name: Update npm CLI for Trusted Publishing
        run: npm install --global npm@latest

      - name: Verify npm Trusted Publishing support
        shell: bash
        run: |
          export NPM_VERSION="$(npm --version)"
          echo "Using npm $NPM_VERSION"
          echo "Registry: $(npm config get registry)"
          echo "User config: $(npm config get userconfig)"
          node -e '
            const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
              console.error("npm Trusted Publishing requires npm >= 11.5.1");
              process.exit(1);
            }
          '

      - name: Verify OIDC and npm auth configuration
        shell: bash
        run: |
          echo "GitHub OIDC URL present: $([[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] && echo yes || echo no)"
          echo "GitHub OIDC request token present: $([[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] && echo yes || echo no)"
          npmrc="$(npm config get userconfig)"
          if grep -q '_authToken' "$npmrc" 2>/dev/null; then
            echo "::error::An _authToken entry remains in npm user config; refusing to publish with ambiguous auth."
            exit 1
          fi
          echo "No static _authToken entry in npm user config."

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run core:build

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish to npmjs using OIDC Trusted Publishing
        run: npm publish --access public --provenance --loglevel verbose
