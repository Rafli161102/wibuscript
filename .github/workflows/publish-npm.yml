name: Stage WibuScript Release to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    name: Build, Test, and Stage for npmjs approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm CLI with staged publishing support
        run: |
          npm install --global npm@11.15.0
          export NPM_VERSION="$(npm --version)"
          echo "Using npm $NPM_VERSION"
          node -e '
            const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
            const supported = major > 11 || (major === 11 && (minor > 15 || (minor === 15 && patch >= 0)));
            if (!supported) {
              console.error("npm staged publishing requires npm >= 11.15.0");
              process.exit(1);
            }
          '
 
      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run core:build

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Stage package on npmjs with OIDC
        run: npm stage publish --access public --provenance
